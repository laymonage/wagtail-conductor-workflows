# Conductor registry index — https://github.com/microsoft/conductor/blob/main/docs/design/registry.md
workflows:
  issue-triage:
    description: >
      Triage newly opened (or reopened) Wagtail issues by template type —
      apply component labels, verify bug reproductions, and post one summary
      comment.
    path: workflows/issue-triage/workflow.yaml
  issue-to-pr:
    description: >
      Implement a fix or enhancement for a (usually triaged) Wagtail issue and
      open a draft pull request from your fork. Reuses reproduction
      environments from prior issue-triage runs of the same issue when
      available, and fills in the repo's PR template.
    path: workflows/issue-to-pr/workflow.yaml
  pr-review:
    description: >
      Review a Wagtail pull request: assess the diff, run the relevant tests,
      and verify behaviour. Produces a verdict recommendation plus overall and
      inline line comments, shown to a human for sign-off. Always submitted as
      a COMMENT review — approve/request-changes are left to humans.
    path: workflows/pr-review/workflow.yaml
